  - {type: chip, at: 45.8, until: 51.8, icon: check, color: "#30D158", title: "1 · Closed eyes", sub: "Calm and confident"}
  - {type: chip, at: 60.9, until: 66.5, icon: star, color: "#FF9F0A", title: "2 · Ornaments", sub: "Culture and tradition"}
  - {type: chip, at: 79.6, until: 83.6, icon: heart, color: "#FF375F", title: "3 · Beauty & calmness", sub: "The feeling of the whole picture"}
